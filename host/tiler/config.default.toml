# Claude 窗口平铺 —— 配置文件
# 平铺功能现在是 RemoteClaude 被控端（host）的一部分，跟着被控端一起运行，不用再单独启动 Python 版平铺工具。
# 位置：~/.claude-window-tiler/config.toml，和原来的 Python 版是同一个文件，原来的设置直接沿用；
# 没有这个文件时，被控端第一次运行会从 host/tiler/config.default.toml 复制一份过来。
# 改完保存就行，下一次重排时自动生效（只有 hotkey 改了要重启被控端）。

# 新开 Claude 会话窗口时是否自动重排。
# 这里改成 false 等于长期关掉自动平铺；快捷键和托盘菜单里的“立即重排”照样能用。
auto_arrange = true

# 每个显示器最多放几个窗口。每个窗口固定占屏幕宽度的 1/N（默认 1/3），高度铺满工作区（不盖任务栏），
# 同一个屏上的窗口从左往右摆：只有 1 个时就在最左边那 1/3，不会铺满。
max_per_monitor = 3

# 改成 true 就换成“按本屏窗口数等分铺满”：1 个占满整屏，2 个各占一半，3 个各占三分之一。
fill_screen = false

# 显示器顺序（先往哪个屏放，放满 max_per_monitor 个再放下一个屏）。
# 也可以在被控端托盘菜单的“屏幕顺序”里直接选，选了会写到这里并马上重排；
# 屏有 2～3 个时，菜单里把按屏幕序号的所有排法都列出来了（屏 2 → 3 → 1 这种，选了写成 [2, 3, 1]）：
#   "left-to-right"  从最左边的屏开始，依次往右（默认）。按屏幕在桌面上的实际左右位置，不看屏幕序号。
#   "right-to-left"  从最右边的屏开始，依次往左（每个屏里面的窗口照样从左往右摆）。
#   "number"         按屏幕序号 1、2、3。序号就是 Windows“显示设置”里点“标识”时屏幕上出现的数字。
#                    （每个屏的序号可以在被控端的平铺状态里查看）
#   [2, 3, 1]        按屏幕序号自己指定顺序（先屏 2、再屏 3、最后屏 1），没写到的屏按序号排在后面
#   "primary"        主屏优先，其余从左到右
monitor_order = "left-to-right"

# false（默认）：所有窗口按顺序依次排——第一个屏从左到右放满，再放下一个屏，互不重叠。
#   顺序按窗口现在的位置（屏幕顺序、从左到右），新开的窗口排在最后；
#   前面有窗口关掉了，下一次重排时后面的窗口依次往前补，必要时会跨屏挪过去。
# true：已经排好的窗口留在原来的屏上，只在本屏内往左靠；新窗口放进第一个还有空位的屏。
#   挪动更少，但各屏可能不是依次放满的。
keep_monitor = false

# true（默认）：关掉一个 Claude 窗口后马上重排，后面的窗口依次往前补上空位。
# false：等下一次新开窗口、还原窗口或手动重排时再补。
# 最小化不会触发重排；把最小化的窗口还原出来时会重排一次，按它原来的位置插回去。
rearrange_on_close = true

# 是否把 Claude 主窗口（带侧边栏的那个）也一起排。默认只排会话窗口。
include_main_window = false

# 新开一个会话窗口后，是否自动把 Claude 主窗口收到托盘（和点主窗口右上角的关闭一样）。
# 默认不收；改成 true 就收，想再打开主窗口就点托盘里的 Claude 图标。
# 安全起见：Claude 设置里关掉了托盘图标时（这时关闭主窗口会让 Claude 整个退出），即使开着也不会去收。
hide_main_window = false

# 新建、关闭 Claude 会话窗口，或者从任务栏 / Alt+Tab 切到任意一个 Claude 会话窗口时，
# 把所有 Claude 会话窗口都提到最前面（不含主窗口，不抢焦点，不改位置）。
# 直接用鼠标点进某个 Claude 窗口时不算，免得把其他屏上别的程序也盖住。
raise_all = true

# 提到最前面时，最小化的 Claude 会话窗口也还原出来。
raise_restores_minimized = true

# false（默认）：最大化的窗口也会被还原，和其他窗口一样按 1/3 排进去。
# true：最大化的窗口不动、也不占位置（这时它会盖住同屏的其他窗口）。
skip_maximized = false

# 窗口之间留多少像素的缝。
gap = 0

# 新窗口出现后等多久再排（毫秒），给 Claude 一点时间把窗口准备好。
delay_ms = 500

# 手动重排的全局快捷键（改了要重启被控端才生效）。写成 "" 表示不要快捷键。
# 可以用 ctrl / alt / shift / win 加一个字母、数字或 F1~F24。
hotkey = "ctrl+alt+shift+t"

# 启动工具时先把现有窗口排一次。
arrange_on_start = true

# ---- 下面一般不用改，Claude 桌面端以后改版认不出窗口时再调 ----
# 识别 Claude 窗口用的进程名、窗口类名
process_names = ["claude.exe"]
window_classes = ["Chrome_WidgetWin_1"]
# 标题以这些开头的窗口不参与平铺（Claude 的 Artifact 独立窗口等）
exclude_title_prefixes = ["Claude · "]
