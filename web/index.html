<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17171b">
<meta name="robots" content="noindex, nofollow">
<title>RemoteClaude</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="auth" hidden>
  <form id="authForm" novalidate>
    <h1>RemoteClaude</h1>
    <p id="authHint" class="muted">登录后查看和操作电脑上的 Claude 会话窗口</p>
    <input id="email" type="email" placeholder="邮箱" autocomplete="username" required>
    <div id="codeRow" class="code-row" hidden>
      <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code">
      <button id="sendCode" type="button">发送验证码</button>
    </div>
    <input id="password" type="password" placeholder="密码" autocomplete="current-password" required>
    <button id="authSubmit" type="submit" class="primary">登录</button>
    <p id="authError" class="error" hidden></p>
    <p id="authInfo" class="info" hidden></p>
    <p class="links">
      <a href="#login" id="toLogin">去登录</a>
      <a href="#register" id="toRegister">注册账号</a>
      <a href="#forgot" id="toForgot">忘记密码</a>
    </p>
  </form>
</section>

<section id="app" hidden>
  <header id="bar">
    <button id="btnPick" type="button" class="title">
      <span id="dot" class="dot wait"></span>
      <span id="curTitle">选择会话</span>
      <span class="caret">▾</span>
    </button>
    <button id="btnAppr" type="button" class="appr-btn" title="等你处理的审批和提问" hidden>审批<span id="apprCount" class="badge">0</span></button>
    <button id="btnFit" type="button" title="还原缩放">适应</button>
    <button id="btnMore" type="button" class="more" title="更多" aria-label="更多" aria-haspopup="menu">⋮</button>
  </header>
  <div id="banners" class="banners"></div>

  <main id="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="hint">正在连接…</div>
  </main>

  <footer id="tools">
    <div id="keys" hidden>
      <button type="button" data-k="Escape">Esc</button>
      <button type="button" data-k="Enter">回车</button>
      <button type="button" data-k="Enter" data-m="2">换行</button>
      <button type="button" data-k="Backspace">退格</button>
      <button type="button" data-k="ArrowUp">↑</button>
      <button type="button" data-k="ArrowDown">↓</button>
      <button type="button" data-k="ArrowLeft">←</button>
      <button type="button" data-k="ArrowRight">→</button>
      <button type="button" data-k="Tab">Tab</button>
      <button type="button" data-k="Tab" data-m="2">Shift+Tab</button>
      <button type="button" data-k="Delete">Del</button>
      <button type="button" data-k="a" data-m="1">全选</button>
      <button type="button" data-k="c" data-m="1">复制</button>
      <button type="button" data-k="v" data-m="1">粘贴</button>
      <button type="button" data-k="z" data-m="1">撤销</button>
    </div>
    <div id="fontBar" hidden>
      <span class="label">字体大小</span>
      <button type="button" data-k="-" data-m="1" title="电脑上的 Claude 缩小一档（Ctrl+-）">缩小</button>
      <button type="button" data-k="0" data-m="1" title="电脑上的 Claude 回到默认大小（Ctrl+0）">默认</button>
      <button type="button" data-k="=" data-m="1" title="电脑上的 Claude 放大一档（Ctrl+=）">放大</button>
      <button id="btnFontDone" type="button">完成</button>
    </div>
    <form id="composer">
      <button id="btnImage" type="button" title="选一张图片粘贴进远程窗口的输入框（也可以直接在这里粘贴图片）">图片</button>
      <input id="imageFile" type="file" accept="image/*" hidden>
      <textarea id="text" rows="1" placeholder="在这里打字，再发到远程窗口" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <button id="btnType" type="button" title="只把文字填进远程窗口">填入</button>
      <button id="btnSend" type="submit" class="primary" title="填入文字并按回车">发送</button>
    </form>
  </footer>

  <div id="picker" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <strong>选择会话</strong>
        <button id="btnRefresh" type="button">刷新</button>
        <button id="btnMore2" type="button" class="more" title="更多" aria-label="更多" aria-haspopup="menu">⋮</button>
        <button id="btnClose" type="button">关闭</button>
      </div>
      <div id="hostTabs"></div>
      <div id="pickerBanners" class="banners"></div>
      <div id="list"></div>
      <div class="sheet-foot muted">账号 <span id="accountEmail"></span></div>
    </div>
  </div>

  <div id="approvals" class="overlay" hidden>
    <div class="sheet tall">
      <div class="sheet-head">
        <strong id="apprTitle">等你处理</strong>
        <button id="apprClose" type="button">关闭</button>
      </div>
      <div id="apprList"></div>
      <div id="apprEmpty" class="empty muted" hidden>没有等你处理的审批</div>
    </div>
  </div>

  <!-- "更多"菜单：#menuLayer 整块盖住界面，点菜单以外的地方只收起菜单，不会点到远程画面上 -->
  <div id="menuLayer" class="menu-layer" hidden>
    <div id="menu" class="menu" role="menu">
      <div id="menuHost" class="menu-note muted"></div>
      <button id="btnKeys" type="button" role="menuitem">显示按键栏</button>
      <button id="btnFont" type="button" role="menuitem" title="调电脑上 Claude 的字体大小">字体大小</button>
      <button id="menuLock" type="button" role="menuitem">锁定电脑</button>
      <div id="menuLockNote" class="menu-note muted" hidden></div>
      <button id="menuLogout" type="button" role="menuitem">退出登录</button>
      <div class="menu-note muted">账号 <span id="menuEmail"></span></div>
    </div>
  </div>

  <div id="lockDlg" class="overlay center" hidden>
    <div class="dialog" role="dialog" aria-labelledby="lockDlgTitle">
      <strong id="lockDlgTitle">锁定电脑？</strong>
      <p id="lockDlgText" class="muted"></p>
      <div class="dialog-actions">
        <button id="lockDlgCancel" type="button">取消</button>
        <button id="lockDlgOk" type="button" class="primary">锁定</button>
      </div>
    </div>
  </div>

  <div id="unlockDlg" class="overlay center" hidden>
    <!-- 不用 <form>：免得浏览器把 Windows 密码当成网站密码提示保存。一直用 type=password：
         手机输入法才会当密码框处理，不记联想词、不走云联想，也不会在中文输入状态下打字 -->
    <div id="unlockForm" class="dialog" role="dialog" aria-labelledby="unlockDlgTitle">
      <strong id="unlockDlgTitle">解锁电脑</strong>
      <p class="muted">输入这台电脑的 Windows 登录密码或 PIN。只用这一次，手机和电脑都不保存。</p>
      <input id="unlockPw" type="password" placeholder="密码或 PIN" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" data-lpignore="true" data-1p-ignore>
      <div class="dialog-actions">
        <button id="unlockCancel" type="button">取消</button>
        <button id="unlockOk" type="button" class="primary">解锁</button>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>
</section>

<script src="unlock.js"></script>
<script src="approvals.js"></script>
<script src="app.js"></script>
</body>
</html>
